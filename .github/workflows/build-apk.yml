name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Prepare web app
        run: node scripts/build-www.js

      - name: Create Android project
        run: |
          npx cap add android
          bash scripts/apply-icons.sh
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../LifestyleOrganiser.apk

      - name: Keep APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: LifestyleOrganiser-apk
          path: LifestyleOrganiser.apk

      - name: Publish APK on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" LifestyleOrganiser.apk \
            --title "Lifestyle Organiser 1.0.${{ github.run_number }}" \
            --notes "Download LifestyleOrganiser.apk below and open it on your Android phone to install."
