name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Prepare web app
        run: node scripts/build-www.js

      - name: Create Android project
        run: |
          npx cap add android
          bash scripts/apply-icons.sh
          npx cap sync android

      - name: Set app version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.LO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LO_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Signing with the permanent Lifestyle Organiser key"
            ./gradlew assembleRelease --no-daemon
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lo.jks"
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/lo.jks" --ks-key-alias lifestyle --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ../LifestyleOrganiser.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs ../LifestyleOrganiser.apk | head -3
            rm -f "$RUNNER_TEMP/lo.jks"
          else
            echo "::warning::Signing secrets not set, building a test APK that can't update an installed copy"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../LifestyleOrganiser.apk
          fi

      - name: Keep APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: LifestyleOrganiser-apk
          path: LifestyleOrganiser.apk

      - name: Publish APK on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.1.${{ github.run_number }}" LifestyleOrganiser.apk \
            --title "Lifestyle Organiser 1.1.${{ github.run_number }}" \
            --notes "Download LifestyleOrganiser.apk below and open it on your Android phone to install."
